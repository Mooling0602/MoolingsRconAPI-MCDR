moolings_rcon_api:
  on_load:
    loading: Loading Mooling's Rcon API...
    register_command:
      registering: Registering commands to MCDR...
      registered: Commands successfully registered to MCDR.
    finish: Rcon connection information will be loaded after server startup completes.
  on_server_startup:
    when_use_asyncrcon_only: Will prioritize trying to import and initialize the Rcon client from the `asyncrcon` package.
    when_use_builtin: Will prioritize trying to use MCDR's built-in Rcon client.
    on_config_loaded: Configuration successfully loaded!
    on_load_config_failed: Failed to load configuration!
  on_command:
    permission_denied: Insufficient permissions!
    on_error: "An error occurred: {}"
    no_response: Command executed, but no response was returned.
    on_debug:
      on_close_confirm: This is a dangerous debugging command, please execute it again to confirm!
      on_config_empty: Loaded empty config!
      help_message:
        description: This command is for debugging.
        valid_usage: "Valid usage:"
  rcon_api:
    on_error:
      built_in_down: MCDR's Rcon client is not working!
      async_down: Async Rcon client has not been initialized yet!
    on_connection_refused: Rcon connection refused, check your network or connection configurations please!
    on_disabled_in_server: Rcon is not enabled in the server configuration for this server run!
    warn_built_in_timeout: Rcon query timed out, reconnecting using private MCDR API...
    async_rcon_client_initialized: Async Rcon client has been initialized!
    async_rcon_client_closed: Async Rcon client closed!
    async_rcon_client_opened: Async Rcon client started!
    async_rcon_client_error: "Failed to connect async rcon client: {}"
    async_rcon_no_passwd_warning: Rcon may need a password to work properly, please edit `server.properties` by yourself and set a valid password.
    async_rcon_auth_failed: Async Rcon authentication failed!
  server_properties_not_found: "File `server.properties` was not found in the specified directory: `{}`."
  check_rcon:
    do_fix: Rcon is not enabled in `server.properties`; this file will be modified to enable Rcon. If it fails, please edit it manually!
    need_edit_config: You can set plugin config option `allow_edit_server_prop` to True and reload the plugin to automatically modify server configuration!
    finish_fix: Please modify server and plugin configurations (if they were not modified automatically) and restart the server to make Rcon work.
  condition_error_message: Condition must be satisfied!
